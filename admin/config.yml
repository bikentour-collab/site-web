# Administration du site Bike'N Tour (Sveltia CMS) : https://www.bikentour.com/admin
# Chaque publication enregistre le contenu dans le dépôt GitHub ; une action GitHub régénère
# alors le site (tools/generate.py) et Railway le remet en ligne en 2 à 3 minutes.
# Pages en 5 langues : content/fr (référence), content/en, content/nl, content/de, content/es.
# Rubriques en accès direct (singletons) ; les listes liées au code (vélos, itinéraires, visites) sont verrouillées.

backend:
  name: github
  repo: __GITHUB_REPO__
  branch: main
  base_url: __SITE_URL__
  auth_endpoint: cms/auth
  commit_messages:
    create: 'Admin : création de {{collection}} « {{slug}} »'
    update: 'Admin : modification de {{collection}} « {{slug}} »'
    delete: 'Admin : suppression de {{collection}} « {{slug}} »'
    uploadMedia: 'Admin : ajout de l''image {{path}}'
    deleteMedia: 'Admin : suppression de l''image {{path}}'
app_title: Bike'N Tour · Administration
logo:
  src: /assets/img/logo-texte.png
site_url: https://www.bikentour.com
display_url: https://www.bikentour.com
media_folder: assets/img/uploads
public_folder: /assets/img/uploads
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2400
          height: 2400
  stock_assets:
    providers: []
asset_collections:
- name: photos-site
  label: Photos du site
  icon: photo_library
  media_folder: assets/img
  public_folder: /assets/img
  readonly: true
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
i18n:
  structure: multiple_folders
  locales:
  - fr
  - en
  - nl
  - de
  - es
  default_locale: fr
editor:
  preview: false
singletons:
- name: guide
  label: Tutoriel et bonnes pratiques
  icon: school
  file: content/guide.json
  fields:
  - name: vu
    label: Tutoriel interactif
    widget: boolean
    required: false
    default: false
    before_input: '**[▶ Ouvrir le tutoriel interactif](/admin/guide/)**'
    after_input: J'ai suivi le tutoriel
    hint: 'Démonstrations pas à pas sur les vrais écrans : changer un prix, mettre en avant un avis, écrire un article, ajouter des photos, traduire, coordonnées, et les 10 bonnes pratiques. À revoir quand vous voulez. Le tutoriel est aussi accessible depuis la page de connexion.'
