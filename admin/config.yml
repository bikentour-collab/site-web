# Administration du site Bike'N Tour (Sveltia CMS) : https://www.bikentour.com/admin
# Chaque publication enregistre le contenu dans le dépôt GitHub ; une action GitHub régénère
# alors le site (tools/generate.py) et Railway le remet en ligne en 2 à 3 minutes.
# Pages en 4 langues : content/fr (référence), content/en, content/nl, content/de.
# Les champs « i18n: duplicate » (prix, photos, identifiants) se modifient en français uniquement.

backend:
  name: github
  repo: __GITHUB_REPO__
  branch: main
  base_url: __SITE_URL__
  auth_endpoint: cms/auth
  commit_messages:
    create: 'Admin : création de {{collection}} « {{slug}} »'
    update: 'Admin : modification de {{collection}} « {{slug}} »'
    delete: 'Admin : suppression de {{collection}} « {{slug}} »'
    uploadMedia: 'Admin : ajout de l''image {{path}}'
    deleteMedia: 'Admin : suppression de l''image {{path}}'
app_title: Bike'N Tour – Administration
logo:
  src: /assets/img/logo-horizontal.png
site_url: https://www.bikentour.com
display_url: https://www.bikentour.com
media_folder: assets/img/uploads
public_folder: /assets/img/uploads
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2400
          height: 2400
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: blog
  label: Articles du blog
  label_singular: article
  description: Les articles publiés sur /fr/blog. L'adresse de l'article (/post/…) est créée à partir du titre et ne change plus ensuite. Le blog est en français.
  folder: content/blog
  create: true
  delete: true
  extension: md
  format: frontmatter
  slug: '{{titre}}'
  identifier_field: titre
  summary: '{{titre}} · {{date}}'
  sortable_fields:
    fields:
    - date
    - titre
    default:
      field: date
      direction: descending
  preview_path: post/{{slug}}
  fields:
  - name: titre
    label: Titre
    widget: string
    hint: Titre de l'article (H1). Idéalement moins de 50 caractères pour Google.
  - name: date
    label: Date de publication
    widget: datetime
    time_format: false
    format: YYYY-MM-DD
    picker_utc: true
    default: '{{now}}'
  - name: resume
    label: Résumé
    widget: text
    hint: 2 ou 3 phrases affichées sous le titre. Les 155 premiers caractères servent aussi de description dans Google.
  - name: image
    label: Photo de couverture
    widget: image
    hint: Photo horizontale de préférence (au moins 1 600 px de large).
  - name: categorie
    label: Catégorie
    widget: select
    default: balades
    options:
    - label: Balades à vélo
      value: balades
    - label: À voir à Nantes
      value: nantes
    - label: Conseils et voyage à vélo
      value: conseils
  - name: lien
    label: Encadré à côté de l'article
    widget: select
    default: auto
    hint: La page du site mise en avant à droite de l'article.
    options:
    - label: Automatique (selon le sujet)
      value: auto
    - label: Tous les itinéraires
      value: hub
    - label: 'Itinéraire : La Loire à Vélo'
      value: route:loire
    - label: 'Itinéraire : La Vélodyssée'
      value: route:velodyssee
    - label: 'Itinéraire : La Régalante'
      value: route:regalante
    - label: 'Itinéraire : La Traversée bretonne'
      value: route:traversee
    - label: 'Itinéraire : Le Canal de Nantes à Brest'
      value: route:canal
    - label: 'Itinéraire : Le Vignoble nantais'
      value: route:vignoble
    - label: Vélo de voyage
      value: bike:voyage
    - label: Vélo électrique
      value: bike:electrique
    - label: Vélo gravel
      value: bike:gravel
    - label: Vélo enfant
      value: bike:enfant
    - label: Vélo cargo
      value: bike:cargo
    - label: 'Visite : panorama nantais'
      value: tour:panorama
    - label: 'Visite : Wine & Bike Tour'
      value: tour:wine
    - label: 'Visite : Culture urbaine'
      value: tour:urbain
  - name: brouillon
    label: Brouillon (non publié sur le site)
    widget: boolean
    default: false
    required: false
  - name: body
    label: Texte de l'article
    widget: markdown
    hint: 'Utilisez des intertitres (Titre 2). Pour une fiche pratique, faites une liste : « Distance : 36 km », « Durée : 2h30 », « Niveau : facile » avec le libellé en gras.'
- name: site
  label: Pages du site
  label_singular: page
  description: Textes, tarifs et photos des pages, en 4 langues (onglets FR, EN, NL, DE). Les prix, photos et identifiants se modifient en français et s'appliquent à toutes les langues.
  files:
  - name: accueil
    label: Accueil
    file: content/{{locale}}/accueil.json
    i18n: true
    fields:
    - name: hero_surtitre
      label: 'Haut de page : petite ligne au-dessus du titre'
      widget: string
      i18n: true
    - name: hero_titre_ligne1
      label: 'Titre : 1re ligne'
      widget: string
      i18n: true
    - name: hero_titre_ligne2
      label: 'Titre : 2e ligne'
      widget: string
      i18n: true
    - name: hero_titre_accent
      label: 'Titre : fin de la 2e ligne (en jaune)'
      widget: string
      i18n: true
    - name: hero_texte
      label: Texte sous le titre
      widget: text
      i18n: true
    - name: hero_image
      label: Photo de fond
      widget: image
      i18n: false
    - name: hero_image_alt
      label: Description de la photo (pour Google et l'accessibilité)
      widget: string
      i18n: true
    - name: google_note
      label: Note Google
      widget: string
      hint: Ex. 5,0
      i18n: false
    - name: google_avis
      label: Nombre d'avis Google
      widget: number
      value_type: int
      i18n: false
    - name: tripadvisor_avis
      label: Nombre d'avis Tripadvisor
      widget: string
      hint: Ex. 200+
      i18n: false
    - name: faq
      label: Questions fréquentes de l'accueil
      label_singular: question
      widget: list
      summary: '{{question}}'
      fields:
      - name: question
        label: Question
        widget: string
        i18n: true
      - name: reponse
        label: Réponse
        widget: text
        i18n: true
      i18n: true
  - name: velos
    label: Vélos, tarifs et accessoires
    file: content/{{locale}}/velos.json
    i18n: true
    fields:
    - name: velos
      label: Vélos
      label_singular: vélo
      widget: list
      allow_add: false
      allow_remove: false
      summary: '{{name}} · {{day}} € / jour'
      fields:
      - name: id
        widget: hidden
        i18n: duplicate
      - name: url
        widget: hidden
        i18n: duplicate
      - name: name
        label: Nom
        widget: string
        i18n: true
      - name: h1
        label: Titre de la page
        widget: string
        i18n: true
      - name: title
        label: Titre Google (60 caractères max.)
        widget: string
        i18n: true
      - name: meta
        label: Description Google (155 caractères max.)
        widget: text
        i18n: true
      - name: lead
        label: Texte d'introduction
        widget: text
        i18n: true
      - name: img
        label: Photo
        widget: image
        i18n: duplicate
      - name: alt
        label: Description de la photo
        widget: string
        i18n: true
      - name: brand
        label: Marque
        widget: string
        i18n: true
      - name: model
        label: Modèle
        widget: string
        i18n: true
      - name: specs
        label: Caractéristiques
        label_singular: caractéristique
        widget: list
        summary: '{{label}} : {{valeur}}'
        fields:
        - name: label
          label: Libellé
          widget: string
          i18n: true
        - name: valeur
          label: Valeur
          widget: string
          i18n: true
        i18n: true
      - name: day
        label: Prix 1 jour (€)
        widget: number
        value_type: int
        i18n: duplicate
      - name: weekend
        label: Prix week-end (€)
        widget: number
        value_type: int
        i18n: duplicate
      - name: week
        label: Prix semaine (€)
        widget: number
        value_type: int
        i18n: duplicate
      - name: grid
        label: Grille jour par jour, de 1 à 7 jours (€)
        widget: list
        required: false
        field:
          name: prix
          label: Prix
          widget: number
          value_type: int
          i18n: duplicate
        i18n: duplicate
      - name: extra
        label: Jour supplémentaire au-delà de 7 jours (€)
        widget: number
        value_type: int
        required: false
        i18n: duplicate
      - name: protect
        label: Protection casse et vol (€ / jour)
        widget: number
        value_type: int
        required: false
        hint: Laisser vide = « nous consulter »
        i18n: duplicate
      - name: deposit
        label: Caution (€)
        widget: number
        value_type: int
        i18n: duplicate
      - name: good
        label: Itinéraires conseillés
        widget: select
        multiple: true
        options:
        - label: La Loire à Vélo
          value: loire
        - label: La Vélodyssée
          value: velodyssee
        - label: La Régalante
          value: regalante
        - label: La Traversée bretonne
          value: traversee
        - label: Le Canal de Nantes à Brest
          value: canal
        - label: Le Vignoble nantais
          value: vignoble
        i18n: duplicate
      - name: why
        label: Pour quels voyages ?
        widget: text
        i18n: true
      i18n: true
    - name: accessoires
      label: Accessoires en option
      label_singular: accessoire
      widget: list
      summary: '{{nom}} · {{prix}} € / jour'
      fields:
      - name: nom
        label: Accessoire
        widget: string
        i18n: true
      - name: prix
        label: Prix par jour (€)
        widget: number
        value_type: int
        i18n: duplicate
      i18n: true
    - name: inclus
      label: Inclus avec chaque vélo
      label_singular: élément
      widget: list
      field:
        name: element
        label: Élément
        widget: string
        i18n: true
      i18n: true
  - name: itineraires
    label: Itinéraires
    file: content/{{locale}}/itineraires.json
    i18n: true
    fields:
    - name: itineraires
      label: Itinéraires
      label_singular: itinéraire
      widget: list
      allow_add: false
      allow_remove: false
      allow_reorder: false
      summary: '{{name}} · {{km}}'
      hint: Le tracé de la carte n'est pas modifiable ici.
      fields:
      - name: id
        widget: hidden
        i18n: duplicate
      - name: color
        widget: hidden
        i18n: duplicate
      - name: url
        widget: hidden
        i18n: duplicate
      - name: dur
        widget: hidden
        i18n: duplicate
      - name: name
        label: Nom
        widget: string
        i18n: true
      - name: short
        label: Accroche courte
        widget: string
        i18n: true
      - name: desc
        label: Description (accueil)
        widget: text
        i18n: true
      - name: img
        label: Photo
        widget: image
        i18n: duplicate
      - name: alt
        label: Description de la photo
        widget: string
        i18n: true
      - name: dist
        label: Distance (texte complet)
        widget: string
        hint: Ex. ≈ 165 km jusqu'à Saumur
        i18n: true
      - name: km
        label: Distance (court)
        widget: string
        hint: Ex. 165 km
        i18n: true
      - name: days
        label: Durée conseillée
        widget: string
        i18n: true
      - name: level
        label: Niveau
        widget: select
        options:
        - Facile
        - Modéré
        - Difficile
        i18n: duplicate
      - name: oneway
        label: Aller simple possible
        widget: boolean
        i18n: duplicate
      - name: steps
        label: Principales villes étapes
        widget: list
        field:
          name: ville
          label: Ville
          widget: string
          i18n: true
        i18n: true
      - name: bike
        label: Vélo conseillé (texte)
        widget: string
        i18n: true
      - name: page
        label: Page de l'itinéraire
        widget: object
        collapsed: true
        fields:
        - name: h1
          label: Titre de la page
          widget: string
          i18n: true
        - name: title
          label: Titre Google (60 caractères max.)
          widget: string
          i18n: true
        - name: meta
          label: Description Google (155 caractères max.)
          widget: text
          i18n: true
        - name: intro
          label: Introduction
          widget: text
          i18n: true
        - name: stages
          label: Étapes conseillées
          label_singular: étape
          widget: list
          summary: '{{etape}}'
          fields:
          - name: etape
            label: Étape (ex. Nantes → Ancenis)
            widget: string
            i18n: true
          - name: texte
            label: Description
            widget: text
            i18n: true
          i18n: true
        - name: highlights
          label: À ne pas manquer
          widget: list
          field:
            name: point
            label: Point fort
            widget: string
            i18n: true
          i18n: true
        - name: back
          label: Le retour
          widget: text
          i18n: true
        - name: faq
          label: Questions fréquentes
          label_singular: question
          widget: list
          summary: '{{question}}'
          fields:
          - name: question
            label: Question
            widget: string
            i18n: true
          - name: reponse
            label: Réponse
            widget: text
            i18n: true
          i18n: true
        i18n: true
      i18n: true
  - name: visites
    label: Visites guidées
    file: content/{{locale}}/visites.json
    i18n: true
    fields:
    - name: visites
      label: Visites
      label_singular: visite
      widget: list
      allow_add: false
      allow_remove: false
      summary: '{{name}} · {{price}} €'
      fields:
      - name: id
        widget: hidden
        i18n: duplicate
      - name: url
        widget: hidden
        i18n: duplicate
      - name: iso
        widget: hidden
        i18n: duplicate
      - name: name
        label: Nom
        widget: string
        i18n: true
      - name: short
        label: Étiquette
        widget: string
        i18n: true
      - name: title
        label: Titre Google (60 caractères max.)
        widget: string
        i18n: true
      - name: meta
        label: Description Google (155 caractères max.)
        widget: text
        i18n: true
      - name: lead
        label: Introduction
        widget: text
        i18n: true
      - name: img
        label: Photo
        widget: image
        i18n: duplicate
      - name: alt
        label: Description de la photo
        widget: string
        i18n: true
      - name: price
        label: Prix par personne (€)
        widget: number
        value_type: int
        i18n: duplicate
      - name: duration
        label: Durée
        widget: string
        hint: Ex. 2 h 30
        i18n: true
      - name: when
        label: Jours et heure de départ
        widget: string
        i18n: true
      - name: langs
        label: Langues
        widget: string
        i18n: true
      - name: meet
        label: Point de rendez-vous
        widget: string
        i18n: true
      - name: stops
        label: Parcours
        label_singular: arrêt
        widget: list
        summary: '{{lieu}}'
        fields:
        - name: lieu
          label: Lieu
          widget: string
          i18n: true
        - name: texte
          label: Description
          widget: text
          i18n: true
        i18n: true
      - name: included
        label: Inclus
        widget: list
        field:
          name: element
          label: Élément
          widget: string
          i18n: true
        i18n: true
      i18n: true
  - name: groupes
    label: Groupes et entreprises
    file: content/{{locale}}/groupes.json
    i18n: true
    fields:
    - name: offres
      label: Formules
      label_singular: formule
      widget: list
      summary: '{{name}} · {{price}}'
      fields:
      - name: id
        label: Identifiant (ancre, sans espace)
        widget: string
        i18n: duplicate
      - name: name
        label: Nom
        widget: string
        i18n: true
      - name: price
        label: Prix
        widget: string
        hint: Ex. À partir de 16,67 € HT par vélo
        i18n: true
      - name: items
        label: Détail
        widget: list
        field:
          name: ligne
          label: Ligne
          widget: string
          i18n: true
        i18n: true
      i18n: true
  - name: balades
    label: Idées de balades
    file: content/{{locale}}/balades.json
    i18n: true
    fields:
    - name: balades
      label: Balades
      label_singular: balade
      widget: list
      summary: '{{name}} · {{km}}'
      fields:
      - name: name
        label: Nom
        widget: string
        i18n: true
      - name: km
        label: Distance
        widget: string
        i18n: true
      - name: time
        label: Durée
        widget: string
        i18n: true
        hint: Ex. Journée, Demi-journée, Week-end
      - name: level
        label: Niveau
        widget: select
        options:
        - Facile
        - Modéré
        - Difficile
        i18n: duplicate
      - name: text
        label: Description
        widget: text
        i18n: true
      - name: back
        label: Retour
        widget: string
        i18n: true
      i18n: true
  - name: faq
    label: FAQ (page complète)
    file: content/{{locale}}/faq.json
    i18n: true
    fields:
    - name: rubriques
      label: Rubriques
      label_singular: rubrique
      widget: list
      summary: '{{titre}}'
      fields:
      - name: titre
        label: Titre de la rubrique
        widget: string
        i18n: true
      - name: questions
        label: Questions
        label_singular: question
        widget: list
        summary: '{{question}}'
        fields:
        - name: question
          label: Question
          widget: string
          i18n: true
        - name: reponse
          label: Réponse
          widget: text
          i18n: true
        i18n: true
      i18n: true
  i18n: true
- name: reglages
  label: Coordonnées, statistiques et presse
  label_singular: réglage
  files:
  - name: presse
    label: Ils parlent de nous
    file: content/fr/presse.json
    fields:
    - name: articles
      label: Articles de presse
      label_singular: article
      widget: list
      summary: '{{media}} · {{titre}}'
      fields:
      - name: media
        label: Média
        widget: string
      - name: titre
        label: Titre
        widget: string
      - name: url
        label: Lien
        widget: string
  - name: coordonnees
    label: Coordonnées et réservation
    file: content/fr/site.json
    fields:
    - name: telephone_affiche
      label: Téléphone (affiché)
      widget: string
      hint: Ex. 06 52 62 94 64
    - name: telephone
      label: Téléphone (format international)
      widget: string
      hint: Ex. +33652629464
    - name: email
      label: Email
      widget: string
    - name: reservation
      label: Lien de réservation en ligne
      widget: string
    - name: analytics_ga4
      label: 'Google Analytics 4 : identifiant de mesure'
      widget: string
      required: false
      hint: Ex. G-ABC123XYZ. Une fois renseigné, la bannière cookies s'affiche et les statistiques ne se chargent qu'après accord du visiteur.
    - name: matomo_url
      label: 'Matomo : adresse du serveur (facultatif)'
      widget: string
      required: false
      hint: Ex. https://bikentour.matomo.cloud/
    - name: matomo_id
      label: 'Matomo : identifiant du site (facultatif)'
      widget: string
      required: false
- name: textes
  label: Pages de texte
  label_singular: page
  files:
  - name: mentions
    label: Mentions légales
    file: content/pages/mentions-legales.md
    format: frontmatter
    fields: &id001
    - name: titre
      label: Titre de la page
      widget: string
    - name: title
      label: Titre Google
      widget: string
    - name: description
      label: Description Google
      widget: text
    - name: body
      label: Texte
      widget: markdown
  - name: cgv
    label: Conditions générales de location
    file: content/pages/conditions-generales-de-vente.md
    format: frontmatter
    fields: *id001
  - name: recrutement
    label: Nous rejoindre
    file: content/pages/nous-rejoindre.md
    format: frontmatter
    fields: *id001
i18n:
  structure: multiple_folders
  locales:
  - fr
  - en
  - nl
  - de
  default_locale: fr
