# Régénère le site après chaque modification faite dans l'admin (/admin) ou dans le code,
# puis enregistre les pages produites : Railway redéploie automatiquement le dernier commit.
name: Générer le site

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
      - 'assets/img/uploads/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'redirects.json'
  workflow_dispatch:      # bouton « Run workflow » pour régénérer à la main
  schedule:
    - cron: '17 4 * * 1'  # chaque lundi : dates « mis à jour le » et sitemap rafraîchis

permissions:
  contents: write

concurrency:
  group: generer-le-site
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Installer les dépendances
        run: pip install -r tools/requirements.txt

      - name: Générer les pages
        working-directory: tools
        env:
          TZ: Europe/Paris
        run: python generate.py

      - name: Enregistrer le site généré
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Site régénéré : $(printf '%s' "${MSG:-mise à jour planifiée}" | head -n 1)"
            git pull --rebase
            git push
          fi
